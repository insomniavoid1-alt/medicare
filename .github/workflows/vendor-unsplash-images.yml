name: Vendor Unsplash images locally

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .github/workflows/vendor-unsplash-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-images:
    if: ${{ !contains(github.event.head_commit.message, '[assets-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download optimized image assets
        run: |
          mkdir -p assets
          curl --fail --location --silent --show-error 'https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&w=900&q=72' --output assets/broker.jpg
          curl --fail --location --silent --show-error 'https://images.unsplash.com/photo-1631217868264-e5b90bb7e133?auto=format&fit=crop&w=900&q=72' --output assets/doctor-patient.jpg
          curl --fail --location --silent --show-error 'https://images.unsplash.com/photo-1761839257647-df30867afd54?auto=format&fit=crop&w=900&q=72' --output assets/retired-couple.jpg
          file assets/*

      - name: Commit images to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Vendor Unsplash images locally [assets-bot]'
          git push
