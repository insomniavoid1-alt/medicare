name: Cloudflare live-site verification

on:
  workflow_run:
    workflows: ["Medicare site checks and Pages deployment"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloudflare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for Cloudflare to publish the expected version
        shell: bash
        run: |
          set -euo pipefail
          url="https://medicare-6pj.pages.dev/"
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "$url" -o /tmp/cloudflare.html \
              && grep -q '<title>Michael Dovsky | Independent Medicare Broker</title>' /tmp/cloudflare.html \
              && grep -q 'cp-soft-enter' /tmp/cloudflare.html \
              && grep -q 'cp-reveal' /tmp/cloudflare.html; then
              ready=1
              echo "Cloudflare serves the expected page and animation hooks (attempt $attempt)."
              break
            fi
            echo "Cloudflare not ready or expected animation hooks absent (attempt $attempt/30); waiting 20 seconds."
            sleep 20
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Cloudflare did not serve the expected page and animation hooks within 10 minutes."
            exit 1
          fi
      - name: Verify live desktop animation actually progresses in Chromium
        env:
          LIVE_URL: https://medicare-6pj.pages.dev/
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const errors = [];
            try {
              const context = await browser.newContext({
                viewport: { width: 1440, height: 1000 },
                reducedMotion: 'no-preference'
              });
              const page = await context.newPage();
              page.on('pageerror', error => errors.push(error.message));
              page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
              await page.addInitScript(() => {
                window.__headlineMotion = [];
                document.addEventListener('animationstart', event => {
                  if (event.animationName !== 'cp-line-enter') return;
                  const el = event.target;
                  const record = { text: el.textContent.trim(), samples: [] };
                  const sample = label => {
                    const style = getComputedStyle(el);
                    const animation = el.getAnimations().find(item => item.animationName === 'cp-line-enter');
                    record.samples.push({
                      at: label,
                      opacity: style.opacity,
                      transform: style.transform,
                      currentTime: animation ? animation.currentTime : null
                    });
                  };
                  sample(0);
                  [100, 300, 600].forEach(ms => setTimeout(() => sample(ms), ms));
                  window.__headlineMotion.push(record);
                }, true);
              });
              await page.goto(process.env.LIVE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
              const state = await page.evaluate(() => ({
                title: document.title,
                reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
                readyClass: document.documentElement.classList.contains('cp-entrance-ready'),
                lines: [...document.querySelectorAll('.hero-copy > h1 > span, .hero-copy > h1 > em')].map(el => ({
                  text: el.textContent.trim(),
                  animationName: getComputedStyle(el).animationName,
                  animationDelay: getComputedStyle(el).animationDelay
                }))
              }));
              console.log('Live desktop animation setup:', JSON.stringify(state));
              if (state.title !== 'Michael Dovsky | Independent Medicare Broker') throw new Error('Unexpected live page title');
              if (state.reducedMotion) throw new Error('Test browser unexpectedly has reduced motion enabled');
              if (state.lines.length !== 3) throw new Error('Expected three separate desktop headline rows');
              if (!state.lines.every(line => line.animationName.includes('cp-line-enter'))) throw new Error('A headline row has no animation assigned');
              if (new Set(state.lines.map(line => line.animationDelay)).size !== 3) throw new Error('Headline rows do not have staggered entrance timing');
              await page.waitForTimeout(1400);
              const records = await page.evaluate(() => window.__headlineMotion);
              console.log('Observed animation-start progression:', JSON.stringify(records));
              if (records.length !== 3) throw new Error('Expected animationstart events for all three headline rows; got ' + records.length);
              for (const record of records) {
                if (record.samples.length < 4) throw new Error('Missing timed samples for headline row: ' + record.text);
                const signatures = new Set(record.samples.map(s => s.opacity + '|' + s.transform));
                if (signatures.size < 2) throw new Error('Headline row did not visibly progress after animationstart: ' + record.text);
              }
              if (errors.length) throw new Error('Browser errors detected: ' + JSON.stringify(errors));
              await page.goto(process.env.LIVE_URL, { waitUntil: 'networkidle', timeout: 60000 });
              const revealCount = await page.locator('.cp-reveal').count();
              if (revealCount <= 15) throw new Error('Expected page-wide scroll reveal targets are missing');
              const lowerSection = page.locator('#medigap .feature-copy > .section-title').first();
              await lowerSection.scrollIntoViewIfNeeded();
              await page.waitForFunction(() => {
                const el = document.querySelector('#medigap .feature-copy > .section-title');
                return !!el && el.classList.contains('cp-visible');
              }, null, { timeout: 10000 });
              console.log('PASS: headline rows animate after first paint and lower-page scroll reveal activates.');
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
