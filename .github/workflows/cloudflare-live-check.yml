name: Cloudflare live-site verification

on:
  workflow_run:
    workflows: ["Medicare site checks and Pages deployment"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloudflare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for Cloudflare to publish the expected version
        shell: bash
        run: |
          set -euo pipefail
          url="https://medicare-6pj.pages.dev/"
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "$url" -o /tmp/cloudflare.html \
              && grep -q '<title>Michael Dovsky | Independent Medicare Broker</title>' /tmp/cloudflare.html \
              && grep -q 'cp-soft-enter' /tmp/cloudflare.html \
              && grep -q 'cp-reveal' /tmp/cloudflare.html; then
              ready=1
              echo "Cloudflare serves the expected page and animation hooks (attempt $attempt)."
              break
            fi
            echo "Cloudflare not ready or expected animation hooks absent (attempt $attempt/30); waiting 20 seconds."
            sleep 20
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Cloudflare did not serve the expected page and animation hooks within 10 minutes."
            exit 1
          fi
      - name: Verify live desktop animation actually progresses in Chromium
        env:
          LIVE_URL: https://medicare-6pj.pages.dev/
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const errors = [];
            try {
              const context = await browser.newContext({
                viewport: { width: 1440, height: 1000 },
                reducedMotion: 'no-preference'
              });
              const page = await context.newPage();
              page.on('pageerror', error => errors.push(error.message));
              page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
              await page.goto(process.env.LIVE_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
              const initial = await page.evaluate(() => ({
                title: document.title,
                reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
                headerAnimation: getComputedStyle(document.querySelector('.site-header')).animationName,
                lines: [...document.querySelectorAll('.hero-copy > h1 > span, .hero-copy > h1 > em')].map(el => {
                  const style = getComputedStyle(el);
                  const animation = el.getAnimations()[0];
                  return {
                    text: el.textContent.trim(),
                    animationName: style.animationName,
                    animationDelay: style.animationDelay,
                    animationDuration: style.animationDuration,
                    playState: animation ? animation.playState : 'missing',
                    currentTime: animation ? animation.currentTime : null,
                    opacity: style.opacity,
                    transform: style.transform
                  };
                })
              }));
              console.log('Initial live desktop animation state:', JSON.stringify(initial));
              if (initial.title !== 'Michael Dovsky | Independent Medicare Broker') throw new Error('Unexpected live page title');
              if (initial.reducedMotion) throw new Error('Test browser unexpectedly has reduced motion enabled');
              if (!initial.headerAnimation.includes('cp-soft-enter')) throw new Error('Desktop header entrance animation is not active on Cloudflare');
              if (initial.lines.length !== 3) throw new Error('Expected three separate desktop headline rows');
              if (!initial.lines.every(line => line.animationName.includes('cp-line-enter') && line.playState !== 'missing')) throw new Error('A headline row has no running CSS animation');
              if (new Set(initial.lines.map(line => line.animationDelay)).size !== 3) throw new Error('Headline rows do not have staggered entrance timing');
              const samples = [];
              for (const wait of [80, 180, 260, 360, 520]) {
                await page.waitForTimeout(wait);
                samples.push(await page.evaluate(() => [...document.querySelectorAll('.hero-copy > h1 > span, .hero-copy > h1 > em')].map(el => {
                  const style = getComputedStyle(el);
                  const animation = el.getAnimations()[0];
                  return { opacity: style.opacity, transform: style.transform, currentTime: animation ? animation.currentTime : null };
                })));
              }
              console.log('Headline animation progression samples:', JSON.stringify(samples));
              const moved = initial.lines.some((line, i) => samples.some(sample => {
                const current = sample[i];
                return current && (current.opacity !== line.opacity || current.transform !== line.transform || current.currentTime !== line.currentTime);
              }));
              if (!moved) throw new Error('Headline CSS animation properties exist but no row showed runtime progression');
              if (errors.length) throw new Error('Browser errors detected: ' + JSON.stringify(errors));
              await page.goto(process.env.LIVE_URL, { waitUntil: 'networkidle', timeout: 60000 });
              const revealCount = await page.locator('.cp-reveal').count();
              if (revealCount <= 15) throw new Error('Expected page-wide scroll reveal targets are missing');
              const lowerSection = page.locator('#medigap .feature-copy > .section-title').first();
              await lowerSection.scrollIntoViewIfNeeded();
              await page.waitForFunction(() => {
                const el = document.querySelector('#medigap .feature-copy > .section-title');
                return !!el && el.classList.contains('cp-visible');
              }, null, { timeout: 10000 });
              console.log('PASS: live headline motion progresses in runtime and lower-page scroll reveal activates.');
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
